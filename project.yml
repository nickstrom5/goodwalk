name: GoodWalk
options:
  bundleIdPrefix: app.goodwalk
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""            # set your team in Xcode or here
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"    # iPhone only for v1
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: "3.0.0"

targets:
  GoodWalk:
    type: application
    platform: iOS
    sources:
      - path: GoodWalk
      - path: Shared
    dependencies:
      - target: GoodWalkWidgets
      - package: PostHog
    entitlements:
      path: GoodWalk/GoodWalk.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.goodwalk.goodwalk
    info:
      path: GoodWalk/Info.plist
      properties:
        CFBundleDisplayName: Good Walk
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSMotionUsageDescription: Good Walk uses your phone's step counter to measure how far you and your dog walked. Nothing leaves your phone.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.goodwalk.goodwalk
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets: [GoodWalkTests]
      storeKitConfiguration: GoodWalk/Resources/Products.storekit

  GoodWalkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GoodWalkTests
    dependencies:
      - target: GoodWalk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.goodwalk.goodwalk.tests
        GENERATE_INFOPLIST_FILE: true

  GoodWalkWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: GoodWalkWidgets
      - path: Shared
      - path: GoodWalk/Intents/StartWalkIntent.swift
    entitlements:
      path: GoodWalkWidgets/GoodWalkWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.goodwalk.goodwalk
    info:
      path: GoodWalkWidgets/Info.plist
      properties:
        CFBundleDisplayName: Good Walk Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.goodwalk.goodwalk.widgets
